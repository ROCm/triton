name: CI

on:
  push:
    branches:
      - shared/gfx1250*
  pull_request:
    branches:
      - shared/gfx1250*
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gfx1250-gluon:
    name: Gluon
    runs-on: ['self-hosted', 'ffm', 'name:smci350']
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Build and Test Gluon
        run: |
          set -xeo pipefail
          RENDER_GID=$(getent group render | cut -d: -f3)
          echo "Render group ID: ${RENDER_GID}"
          docker run --rm \
            --device=/dev/kfd --device=/dev/dri --group-add video --group-add $RENDER_GID \
            --cap-add=SYS_PTRACE --security-opt seccomp=unconfined \
            --shm-size=16G --ulimit memlock=-1 --ulimit stack=67108864 \
            -v /data/ci/actions-runner/_work/triton/triton:/code \
            -v /data/ci/llvm/27d654c4-release:/llvm \
            -v /data/ci/ffm/rocdtif-7.1-am+ffmlite-mi400-r2.03:/ffm-base \
            -v /data/ci/ffm/ffmlite-main-186-25f7800e-20260216:/ffm-update \
            -v /data/ci/triton-cache/json:/root/.triton/json \
            -v /data/ci/triton-cache/llvm:/root/.triton/llvm \
            -v /data/ci/triton-cache/nvidia:/root/.triton/nvidia \
            -v /data/ci/ccache:/root/.ccache \
            -w /code \
            --entrypoint bash \
            mkmhub.amd.com/sw-aiggfx1250-dev/ci/gfx1250-env:1.3 \
            -lc "/code/.github/workflows/gluon.sh"

  gfx1250-triton:
    name: Triton
    runs-on: ['self-hosted', 'ffm', 'pytorch', 'name:gbt350']
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Build and Test Triton
        run: |
          set -xeo pipefail
          RENDER_GID=$(getent group render | cut -d: -f3)
          echo "Render group ID: ${RENDER_GID}"
          docker run --rm \
            --device=/dev/kfd --device=/dev/dri --group-add video --group-add $RENDER_GID \
            --cap-add=SYS_PTRACE --security-opt seccomp=unconfined \
            --shm-size=16G --ulimit memlock=-1 --ulimit stack=67108864 \
            -v /data/ci/actions-runner/_work/triton/triton:/code \
            -v /data/ci/llvm/27d654c4-release:/llvm \
            -v /data/ci/ffm/rocdtif-7.1-am+ffmlite-mi400-r2.03:/ffm-base \
            -v /data/ci/ffm/ffmlite-main-186-25f7800e-20260216:/ffm-update \
            -v /data/ci/triton-cache/json:/root/.triton/json \
            -v /data/ci/triton-cache/llvm:/root/.triton/llvm \
            -v /data/ci/triton-cache/nvidia:/root/.triton/nvidia \
            -v /data/ci/ccache:/root/.ccache \
            -w /code \
            --entrypoint bash \
            mkmhub.amd.com/sw-aiggfx1250-dev/ci/gfx1250-pytorch-env:1.3 \
            -lc "/code/.github/workflows/triton.sh"

  gfx1250-moe:
    name: MoE
    runs-on: ['self-hosted', 'ffm', 'pytorch', 'name:gbt350']
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Build and Test MoE
        run: |
          set -xeo pipefail
          RENDER_GID=$(getent group render | cut -d: -f3)
          echo "Render group ID: ${RENDER_GID}"
          docker run --rm \
            --device=/dev/kfd --device=/dev/dri --group-add video --group-add $RENDER_GID \
            --cap-add=SYS_PTRACE --security-opt seccomp=unconfined \
            --shm-size=16G --ulimit memlock=-1 --ulimit stack=67108864 \
            -v /data/ci/actions-runner/_work/triton/triton:/code \
            -v /data/ci/llvm/27d654c4-release:/llvm \
            -v /data/ci/ffm/rocdtif-7.1-am+ffmlite-mi400-r2.03:/ffm-base \
            -v /data/ci/ffm/ffm-main-206-20260223:/ffm-update \
            -v /data/ci/triton-cache/json:/root/.triton/json \
            -v /data/ci/triton-cache/llvm:/root/.triton/llvm \
            -v /data/ci/triton-cache/nvidia:/root/.triton/nvidia \
            -v /data/ci/ccache:/root/.ccache \
            -w /code \
            --entrypoint bash \
            mkmhub.amd.com/sw-aiggfx1250-dev/ci/gfx1250-pytorch-env:1.4 \
            -lc "/code/.github/workflows/moe.sh"
